<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>游戏反外挂系统 | 捍卫公平竞技</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, 'Segoe UI', 'Poppins', 'Noto Sans', sans-serif;
        }

        body {
            background: linear-gradient(145deg, #0a0f1e 0%, #0b1525 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* 主容器 */
        .app-container {
            max-width: 1300px;
            width: 100%;
            background: rgba(18, 25, 45, 0.65);
            backdrop-filter: blur(4px);
            border-radius: 3rem;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.1);
            overflow: hidden;
            transition: all 0.3s ease;
            border: 1px solid rgba(80, 180, 255, 0.3);
        }

        /* 页面切换视图 */
        .page {
            padding: 2rem 2rem 2.5rem;
            transition: 0.2s;
        }

        .hidden-page {
            display: none;
        }

        /* ========= 欢迎首页 ========= */
        .welcome-hero {
            text-align: center;
            background: radial-gradient(circle at 20% 30%, rgba(255, 120, 80, 0.2), transparent 70%);
            border-radius: 2rem;
            padding: 1.5rem 0.5rem 2rem;
        }

        .main-title {
            font-size: 3.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #FFD966, #FF8C42, #FF3C7E, #6C63FF);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: gradientShift 6s ease infinite;
            text-shadow: 0 5px 20px rgba(0,0,0,0.3);
            letter-spacing: -0.5px;
            margin-bottom: 1rem;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .anti-cheat-badge {
            display: inline-block;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            border-radius: 80px;
            padding: 0.4rem 1.2rem;
            font-size: 1rem;
            font-weight: 500;
            color: #7effb3;
            border: 1px solid #3eff9e;
            margin-bottom: 2rem;
        }

        .stats-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 2rem;
            margin: 2rem 0;
        }

        .stat-card {
            background: rgba(10, 20, 35, 0.8);
            backdrop-filter: blur(4px);
            border-radius: 2rem;
            padding: 1.2rem 2rem;
            min-width: 180px;
            border-left: 5px solid #ff6b4a;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            transition: transform 0.2s;
        }

        .stat-card:hover { transform: translateY(-5px); }

        .stat-number {
            font-size: 2.4rem;
            font-weight: 800;
            color: #f5c542;
        }

        .stat-label {
            color: #ccddf8;
            font-weight: 500;
            margin-top: 8px;
        }

        .banned-section {
            background: linear-gradient(120deg, #1e293b, #0f172a);
            border-radius: 2rem;
            padding: 1.2rem;
            margin: 2rem 0;
            border: 1px solid #ff4757aa;
        }

        .banned-number {
            font-size: 2.2rem;
            font-weight: bold;
            color: #ff7b89;
        }

        .btn-start {
            background: linear-gradient(95deg, #3a86ff, #8338ec);
            border: none;
            padding: 1rem 2.8rem;
            font-size: 1.5rem;
            font-weight: bold;
            border-radius: 60px;
            color: white;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            margin-top: 1rem;
        }

        .btn-start:hover {
            transform: scale(1.02);
            background: linear-gradient(95deg, #2a6eff, #7224e0);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.4);
        }

        /* 功能区公用样式 */
        .section-title {
            font-size: 2rem;
            font-weight: 700;
            color: #f0f3fa;
            border-left: 6px solid #ff914d;
            padding-left: 1rem;
            margin-bottom: 1.8rem;
        }

        .two-columns {
            display: flex;
            flex-wrap: wrap;
            gap: 2rem;
            margin-top: 1.5rem;
        }

        .func-card {
            flex: 1;
            background: rgba(25, 35, 55, 0.7);
            backdrop-filter: blur(8px);
            border-radius: 2rem;
            padding: 2rem;
            transition: all 0.2s;
            border: 1px solid rgba(255, 200, 100, 0.3);
            cursor: pointer;
        }

        .func-card:hover {
            background: rgba(35, 48, 70, 0.85);
            border-color: #ffbc6e;
            transform: translateY(-6px);
        }

        .func-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        .func-title {
            font-size: 1.8rem;
            font-weight: bold;
            color: #ffcf9a;
        }

        .func-desc {
            color: #b9c7dd;
            margin-top: 0.8rem;
        }

        /* 举报表单区 / 下载面板 */
        .report-panel, .download-panel {
            background: rgba(10, 18, 30, 0.9);
            border-radius: 2rem;
            padding: 1.6rem;
            margin-top: 2rem;
            border: 1px solid #f0b27a;
        }

        .game-buttons {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            margin: 1.2rem 0;
        }

        .game-btn {
            background: #2c3e66;
            border: none;
            padding: 0.6rem 1.4rem;
            border-radius: 40px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.1s;
        }

        .game-btn.active {
            background: #e67e22;
            box-shadow: 0 0 8px #ffa559;
        }

        .input-group {
            margin: 1rem 0;
        }

        .input-group label {
            display: block;
            margin-bottom: 0.4rem;
            font-weight: 600;
            color: #ddddff;
        }

        .input-group input, .input-group textarea, .input-group select {
            width: 100%;
            padding: 0.8rem;
            border-radius: 1.2rem;
            border: none;
            background: #1f2a3e;
            color: white;
            font-size: 0.95rem;
        }

        .submit-report {
            background: #e67e22;
            border: none;
            padding: 0.8rem 1.8rem;
            border-radius: 2rem;
            font-weight: bold;
            margin-top: 1rem;
            cursor: pointer;
            transition: 0.1s;
        }

        .back-home {
            background: #4a5b7a;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 2rem;
            margin-top: 1.5rem;
            cursor: pointer;
            color: white;
            font-weight: bold;
        }

        .toast-msg {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #1f2b3c;
            backdrop-filter: blur(16px);
            padding: 12px 24px;
            border-radius: 40px;
            color: #c3ffb2;
            font-weight: bold;
            z-index: 1000;
            box-shadow: 0 5px 15px black;
            border-left: 5px solid #2ecc71;
            pointer-events: none;
            transition: 0.2s;
        }

        footer {
            text-align: center;
            margin-top: 2.5rem;
            color: #5f7f9e;
            font-size: 0.8rem;
        }

        @media (max-width: 680px) {
            .page { padding: 1rem; }
            .main-title { font-size: 2rem; }
            .func-title { font-size: 1.4rem; }
        }
        hr {
            border-color: #2a405c;
            margin: 1rem 0;
        }
        .warning-text {
            color: #ffae70;
        }
        .download-btn {
            background: linear-gradient(95deg, #2c7a4d, #1e5a3a);
            border: none;
            padding: 14px 36px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 60px;
            color: white;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 6px 16px rgba(0,0,0,0.3);
            margin: 10px 0;
            display: inline-block;
            text-decoration: none;
        }
        .download-btn:hover {
            transform: scale(1.02);
            background: linear-gradient(95deg, #1e6b42, #0f4a2c);
        }
        .quark-info {
            background: #1e2a3a;
            border-radius: 50px;
            padding: 8px 16px;
            font-size: 0.85rem;
            margin-top: 10px;
            display: inline-block;
        }
    </style>
</head>
<body>

<div class="app-container" id="appRoot">
    <!-- 首页：欢迎 + 反外挂系统介绍  -->
    <div id="homePage" class="page">
        <div class="welcome-hero">
            <div class="anti-cheat-badge">⚡ 官方认证 · 公平竞技联盟 ⚡</div>
            <div class="main-title">欢迎来到游戏反外挂系统</div>
            <p style="color:#cbd5ff; font-size:1.2rem; margin-top: 0.5rem;">捍卫每一场对局的公正</p>
            
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-number">30,000+</div>
                    <div class="stat-label">🙌 已帮助3万多名玩家抵制外挂</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">3,720</div>
                    <div class="stat-label">⚠️ 已封禁违规账号</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">100%</div>
                    <div class="stat-label">🛡️ 全游戏覆盖监控</div>
                </div>
            </div>
            <div class="banned-section">
                📢 <strong class="banned-number">以封号3,720个违规账号</strong> 包括和平精英、无畏契约、三角洲等热门游戏，持续净化环境！
            </div>
            <div style="font-size: 1.1rem; background: #00000055; border-radius: 2rem; padding: 12px; margin: 10px 0;">
                🛡️ 抵制外挂 · 从我做起 🛡️
            </div>
            <button class="btn-start" id="startBtn">✨ 点击开始反外挂 ✨</button>
        </div>
        <footer>© 反外挂先锋行动 | 公平竞技永不缺席</footer>
    </div>

    <!-- 功能区页面 (举报+下载反外挂工具) -->
    <div id="functionPage" class="page hidden-page">
        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap;">
            <div class="section-title">⚔️ 欢迎来到反外挂专区 ⚔️</div>
            <button class="back-home" id="backHomeBtn">🏠 返回首页</button>
        </div>
        <div class="two-columns">
            <!-- 举报栏目 -->
            <div class="func-card" id="reportCard">
                <div class="func-icon">📢</div>
                <div class="func-title">游戏举报</div>
                <div class="func-desc">举报作弊玩家，维护绿色环境</div>
            </div>
            <!-- 下载反外挂工具栏目 -->
            <div class="func-card" id="downloadCard">
                <div class="func-icon">⬇️</div>
                <div class="func-title">下载反外挂工具</div>
                <div class="func-desc">强大的反作弊客户端，实时防护</div>
            </div>
        </div>

        <!-- 动态渲染的举报面板 & 下载面板 (默认隐藏) -->
        <div id="dynamicPanel"></div>
        <footer style="margin-top: 2rem;">🔒 每一次举报都是对公平的守护</footer>
    </div>
</div>

<script>
    // DOM 元素
    const homePage = document.getElementById('homePage');
    const functionPage = document.getElementById('functionPage');
    const startBtn = document.getElementById('startBtn');
    const backHomeBtn = document.getElementById('backHomeBtn');
    const dynamicPanel = document.getElementById('dynamicPanel');
    
    // 当前激活的栏目
    let activePanelType = null;

    // 夸克网盘配置
    const QUARK_URL = "https://pan.quark.cn/s/b29f26499b73?pwd=kpuA";
    const QUARK_PWD = "kpuA";

    // 显示提示消息
    function showToast(message, isError = false) {
        const existingToast = document.querySelector('.toast-msg');
        if(existingToast) existingToast.remove();
        const toast = document.createElement('div');
        toast.className = 'toast-msg';
        toast.innerText = message;
        if(isError) toast.style.borderLeftColor = '#ff4d4d';
        else toast.style.borderLeftColor = '#2ecc71';
        document.body.appendChild(toast);
        setTimeout(() => {
            toast.style.opacity = '0';
            setTimeout(() => toast.remove(), 300);
        }, 2800);
    }

    // 渲染举报面板
    function renderReportPanel() {
        const games = ['和平精英', '无畏契约', '三角洲行动'];
        let selectedGame = games[0];
        
        const panelDiv = document.createElement('div');
        panelDiv.className = 'report-panel';
        panelDiv.innerHTML = `
            <h3 style="color: #ffbc6e; margin-bottom: 0.8rem;">📝 举报违规玩家</h3>
            <div class="game-buttons" id="gameSelectContainer">
                ${games.map(game => `<button class="game-btn" data-game="${game}">${game}</button>`).join('')}
            </div>
            <div class="input-group">
                <label>🎮 对方游戏ID / 角色名</label>
                <input type="text" id="cheaterId" placeholder="请输入违规玩家的游戏ID或昵称" autocomplete="off">
            </div>
            <div class="input-group">
                <label>📌 举报原因 (选填或描述外挂类型)</label>
                <textarea id="cheatReason" rows="2" placeholder="例如：透视自瞄、加速外挂、异常数据等"></textarea>
            </div>
            <div class="input-group">
                <label>📎 补充说明 (可选)</label>
                <input type="text" id="extraInfo" placeholder="提供更多线索有助于核实">
            </div>
            <button class="submit-report" id="submitReportBtn">🚨 提交举报 🚨</button>
            <div style="margin-top: 12px; font-size:0.85rem; color:#aab7d4;">* 举报后我们将快速审核，维护绿色游戏</div>
        `;
        
        const attachEvents = () => {
            const btns = panelDiv.querySelectorAll('.game-btn');
            const updateActive = (activeGame) => {
                btns.forEach(btn => {
                    if(btn.getAttribute('data-game') === activeGame) {
                        btn.classList.add('active');
                    } else {
                        btn.classList.remove('active');
                    }
                });
            };
            btns.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    selectedGame = btn.getAttribute('data-game');
                    updateActive(selectedGame);
                });
            });
            if(btns.length) {
                btns[0].classList.add('active');
                selectedGame = games[0];
            }
            const submitBtn = panelDiv.querySelector('#submitReportBtn');
            submitBtn.addEventListener('click', () => {
                const playerId = panelDiv.querySelector('#cheaterId').value.trim();
                const reason = panelDiv.querySelector('#cheatReason').value.trim();
                const extra = panelDiv.querySelector('#extraInfo').value.trim();
                if(!playerId) {
                    showToast('❌ 请填写对方的游戏ID/昵称！', true);
                    return;
                }
                if(!reason) {
                    showToast('⚠️ 请简单描述外挂类型 (如透视自瞄等)', true);
                    return;
                }
                const cheatType = reason.length > 50 ? reason.slice(0,50)+"..." : reason;
                showToast(`✅ 感谢您的举报！我们将会依法处置，维护绿色环境。`, false);
                panelDiv.querySelector('#cheaterId').value = '';
                panelDiv.querySelector('#cheatReason').value = '';
                panelDiv.querySelector('#extraInfo').value = '';
                console.log(`[举报记录] 游戏:${selectedGame} ID:${playerId} 原因:${reason} 附加:${extra}`);
            });
        };
        return { panelDiv, attachEvents };
    }

    // 渲染下载面板 (夸克网盘)
    function renderDownloadPanel() {
        const panelDiv = document.createElement('div');
        panelDiv.className = 'download-panel';
        panelDiv.innerHTML = `
            <div style="display: flex; flex-direction: column; align-items: center; text-align: center;">
                <div style="font-size: 3rem;">🛠️</div>
                <h3 style="color: #fee3b5; margin: 0.5rem 0;">反外挂安全工具 v3.7</h3>
                <p style="margin: 5px 0;">强力内存扫描 · AI行为检测 · 实时反作弊驱动</p>
                <div class="quark-info">
                    📦 夸克网盘分享 | 提取码: <strong style="color:#ffaa66;">${QUARK_PWD}</strong>
                </div>
                <a href="${QUARK_URL}" target="_blank" rel="noopener noreferrer" class="download-btn" id="quarkDownloadLink">
                    ☁️ 前往夸克网盘下载 (.exe)
                </a>
                <p style="font-size: 0.85rem; color: #b8c7ff; margin-top: 8px;">✅ 点击后跳转至夸克网盘，输入提取码即可下载<br>安全可靠，实时更新特征库</p>
                <div style="display: flex; gap: 12px; margin-top: 8px; flex-wrap: wrap; justify-content: center;">
                    <button id="copyUrlBtn" style="background: #3a4b6e; border: none; padding: 8px 20px; border-radius: 40px; cursor: pointer; color: white;">📋 复制网盘链接</button>
                    <button id="copyPwdBtn" style="background: #3a4b6e; border: none; padding: 8px 20px; border-radius: 40px; cursor: pointer; color: white;">🔑 复制提取码</button>
                </div>
                <p style="font-size: 0.75rem; margin-top: 12px; color: #8aa0c0;">* 若无法直接下载，请复制链接到浏览器打开</p>
            </div>
        `;
        
        const afterRender = () => {
            const copyUrlBtn = panelDiv.querySelector('#copyUrlBtn');
            const copyPwdBtn = panelDiv.querySelector('#copyPwdBtn');
            const downloadLink = panelDiv.querySelector('#quarkDownloadLink');
            
            if(copyUrlBtn) {
                copyUrlBtn.addEventListener('click', () => {
                    navigator.clipboard.writeText(QUARK_URL).then(() => {
                        showToast("✅ 夸克网盘链接已复制！", false);
                    }).catch(() => showToast("手动复制: " + QUARK_URL, true));
                });
            }
            if(copyPwdBtn) {
                copyPwdBtn.addEventListener('click', () => {
                    navigator.clipboard.writeText(QUARK_PWD).then(() => {
                        showToast(`✅ 提取码 ${QUARK_PWD} 已复制`, false);
                    }).catch(() => showToast("提取码: " + QUARK_PWD, true));
                });
            }
            // 可选: 增加点击下载链接的友好提示
            if(downloadLink) {
                downloadLink.addEventListener('click', (e) => {
                    showToast("正在跳转至夸克网盘，请稍候...", false);
                });
            }
        };
        return { panelDiv, afterRender };
    }

    // 清除动态面板内容并展示对应栏目
    function switchToPanel(type) {
        if(!dynamicPanel) return;
        dynamicPanel.innerHTML = '';
        activePanelType = type;
        if(type === 'report') {
            const { panelDiv, attachEvents } = renderReportPanel();
            dynamicPanel.appendChild(panelDiv);
            attachEvents();
        } 
        else if(type === 'download') {
            const { panelDiv, afterRender } = renderDownloadPanel();
            dynamicPanel.appendChild(panelDiv);
            afterRender();
        }
    }

    function goToFunctionPage() {
        homePage.classList.add('hidden-page');
        functionPage.classList.remove('hidden-page');
        dynamicPanel.innerHTML = '';
        activePanelType = null;
        bindFuncCardsEvents();
    }

    function bindFuncCardsEvents() {
        const reportCard = document.getElementById('reportCard');
        const downloadCard = document.getElementById('downloadCard');
        if(!reportCard || !downloadCard) return;
        const newReportCard = reportCard.cloneNode(true);
        const newDownloadCard = downloadCard.cloneNode(true);
        reportCard.parentNode.replaceChild(newReportCard, reportCard);
        downloadCard.parentNode.replaceChild(newDownloadCard, downloadCard);
        
        const finalReportCard = document.getElementById('reportCard');
        const finalDownloadCard = document.getElementById('downloadCard');
        
        finalReportCard.addEventListener('click', () => {
            switchToPanel('report');
            dynamicPanel.scrollIntoView({ behavior: 'smooth', block: 'start' });
        });
        finalDownloadCard.addEventListener('click', () => {
            switchToPanel('download');
            dynamicPanel.scrollIntoView({ behavior: 'smooth', block: 'start' });
        });
    }

    function goToHomePage() {
        functionPage.classList.add('hidden-page');
        homePage.classList.remove('hidden-page');
        dynamicPanel.innerHTML = '';
        activePanelType = null;
    }

    function initExtraStyles() {
        const heroDiv = document.querySelector('.welcome-hero');
        if(heroDiv && !document.querySelector('.special-note')) {
            const note = document.createElement('div');
            note.className = 'special-note';
            note.style.marginTop = '12px';
            note.style.background = '#ffa55920';
            note.style.padding = '5px 12px';
            note.style.borderRadius = '30px';
            note.innerHTML = '🛡️ 已帮助超过3万多名玩家抵制外挂，拒绝作弊，从我做起！ 🛡️';
            heroDiv.appendChild(note);
        }
    }

    function bindGlobalEvents() {
        if(startBtn) startBtn.addEventListener('click', goToFunctionPage);
        if(backHomeBtn) backHomeBtn.addEventListener('click', goToHomePage);
    }

    function init() {
        bindGlobalEvents();
        initExtraStyles();
        homePage.classList.remove('hidden-page');
        functionPage.classList.add('hidden-page');
        dynamicPanel.innerHTML = '';
    }

    init();
</script>
</body>
</html>
